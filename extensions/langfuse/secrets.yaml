# The whole configuration. Names only; set values in the panel (paste the block Langfuse shows
# after creating a key) or with `mise run secrets`. Not BOT_*: bots never see these keys.
# `url` opens the API keys page of the last Langfuse project used (Langfuse's `~` project route).
- name: LANGFUSE_PUBLIC_KEY
  description: {es: Clave pública del proyecto de Langfuse (pk-lf-…), en: Langfuse project public key (pk-lf-…)}
  url: https://cloud.langfuse.com/project/~/settings/api-keys
  required: true
- name: LANGFUSE_SECRET_KEY
  description: {es: Clave secreta del proyecto de Langfuse (sk-lf-…), en: Langfuse project secret key (sk-lf-…)}
  url: https://cloud.langfuse.com/project/~/settings/api-keys
  required: true
- name: LANGFUSE_BASE_URL
  description: {es: "Opcional. Vacío = Langfuse Cloud EU; https://us.cloud.langfuse.com para US", en: "Optional. Empty = Langfuse Cloud EU; https://us.cloud.langfuse.com for US"}
  required: false
